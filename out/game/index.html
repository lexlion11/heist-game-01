<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cold Signal — an original heist game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #050a10; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Cold Signal: a top-down heist game. Cross the Meridian Signal Annex, read the guards' vision cones, cut the cameras, crack the signal vault and escape with the loot."></canvas>
<p id="status" role="status" aria-live="polite">Cold Signal. Move with WASD or the arrow keys, sneak with Shift, work the vault with E, use a tool with Space.</p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
